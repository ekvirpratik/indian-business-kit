<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>CRM — Indian Business Kit</title>
    <meta name="description" content="Supercharge your Indian business sales with CRM lead tracking, automated follow-ups, WhatsApp marketing, quotations, and pipeline management." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1e1b4b" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CRM — Indian Business Kit" />
    <meta property="og:description" content="Supercharge your Indian business sales with lead tracking, automated follow-ups, and WhatsApp marketing." />
    <meta property="og:site_name" content="Indian Business Kit" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://clerk.indianbusinesskit.in https://*.clerk.accounts.dev https://challenges.cloudflare.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.supabase.co https://img.clerk.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.clerk.accounts.dev https://clerk.indianbusinesskit.in;
      frame-src https://challenges.cloudflare.com https://*.clerk.accounts.dev;
      object-src 'none';
      base-uri 'self';
    " />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts — non-render-blocking -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Fallback for no-JS -->
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
