name: Database Keep-Alive Health Check

on:
  schedule:
    # Runs at minute 0 of every hour (every 1 hour, 24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

jobs:
  ping-supabase:
    name: Supabase Health Check & Keep-Alive
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Database Keep-Alive Health Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/supabase-health-check.js
